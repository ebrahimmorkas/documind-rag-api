name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: hashFiles('tests/**/*.csproj') != ''
        run: >
          dotnet test --no-build --configuration Release
          --report-trx --results-directory TestResults
          --coverage --coverage-output-format cobertura

      - name: Upload test results
        if: always() && hashFiles('TestResults/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults


  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/DocuMind.Api/Dockerfile
          load: true
          tags: documind:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and exercise the API
        run: |
          docker run -d --name documind -p 8080:8080 documind:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health && break; sleep 2; done

          printf 'The warranty covers manufacturing defects for 24 months.' > warranty.txt
          curl -fs -F "file=@warranty.txt" http://localhost:8080/api/documents
          curl -fs "http://localhost:8080/api/search?q=warranty" | grep -q "warranty.txt"
          echo "Upload and search work"

          # Without an API key, answering must fail clearly instead of crashing.
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"question":"How long is the warranty?"}' http://localhost:8080/api/ask)
          [ "$status" = "503" ] || { docker logs documind; exit 1; }
          curl -fs http://localhost:8080/ | grep -q "DocuMind"
          echo "Ask without key returns 503 and the UI is served"
